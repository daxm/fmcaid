[tool.poetry]
name = "fmcaid"
version = "0.20260213.0"
description = "Thin FMC client with optional MCP adapter for AI-driven Cisco Firepower management"
authors = ["Dax Mickelson <github@daxm.net>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/daxm/fmcmcp"
repository = "https://github.com/daxm/fmcmcp"
documentation = "https://github.com/daxm/fmcmcp/blob/main/CLAUDE.md"
keywords = ["cisco", "firepower", "fmc", "mcp", "rest-api", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking :: Firewalls",
]
packages = [{include = "fmcaid"}]

[tool.poetry.dependencies]
python = "^3.11"
requests = "^2.31.0"
urllib3 = "^2.0.0"
mcp = "^1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
black = "^23.0.0"

[tool.poetry.scripts]
fmcaid = "fmcaid.mcp_server:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
